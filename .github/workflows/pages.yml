name: Deploy factory website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build React site
        working-directory: web
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      # The Pages API may briefly return no artifact immediately after upload.
      # Keep the existing upload/deploy actions and allow metadata to propagate.
      - name: Wait for Pages artifact indexing
        run: sleep 35
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  live-test:
    name: Verify published site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check production GitHub Pages
        working-directory: web
        run: npm run test:live
      - name: Attach production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-live-site
          path: web/test-results/live-*.png
          if-no-files-found: ignore
