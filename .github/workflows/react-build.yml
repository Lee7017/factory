name: React shadcn migration build
on:
  push:
    branches:
      - main
      - feat/react-shadcn-migration
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/react-build.yml"
      - "app.js"
      - "access.js"
      - "modules.js"
      - "operations.js"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Business data regression tests
        working-directory: web
        run: npm run test:unit
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Install Chromium for UI checks
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        working-directory: web
        run: npm run test:smoke
      - name: Cockpit Gantt, donut, Agent and mobile UI checks
        working-directory: web
        run: npm run test:overview
      - name: All business modules and record write checks
        working-directory: web
        run: npm run test:full
      - name: Purchase approval and warehouse-QC integrity
        working-directory: web
        run: npm run test:purchase
      - name: Production cleaning and setup gate tracking
        working-directory: web
        run: npm run test:production-gates
      - name: Signed cleaning QC inspection and re-cleaning
        working-directory: web
        run: npm run test:clean-inspection
      - name: Sales order shipment auto-fill and split delivery
        working-directory: web
        run: npm run test:outbound-prefill
      - name: Current workspace only — do not import obsolete data
        working-directory: web
        run: npm run test:current
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-react-smoke
          path: web/test-results
          if-no-files-found: ignore
      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: factory-react-preview
          path: web/dist
          if-no-files-found: error
